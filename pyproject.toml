[project]
authors = [{name = "Hunter Kunzelmann", email = "hkunzelmann@limno.com"}]
dependencies = ["dataretrieval>=1.4.0,<2", "dotenv>=0.9.9,<0.10"]
name = "water-data-retrieval"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ['conda-forge']
platforms = ['win-64']

[tool.pixi.pypi-dependencies]
water_data_retrieval = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.5,<3"
pandas = ">=3.1.1,<4"
openpyxl = ">=3.1.5,<4"
ipykernel = ">=7.4.0,<8"
matplotlib = ">=3.11.2,<4"
pathlib = ">=1.0.1,<2"
datetime = ">=6.0,<7"
ipywidgets = ">=8.1.9,<9"
